name: release

# Build standalone uukanshu binaries for every platform and attach them to a
# GitHub Release. PyInstaller cannot cross-compile, so each artifact is built
# on a matching runner (ubuntu → linux-x86_64, macos → macos-arm64, windows →
# windows-x86_64). Triggered by pushing a v* tag, or manually.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: uukanshu-linux-x86_64
          - os: macos-latest
            asset: uukanshu-macos-arm64
          - os: windows-latest
            asset: uukanshu-windows-x86_64.exe

    steps:
      - uses: actions/checkout@v7

      # Build with the uv-managed Python toolchain. The binary's TLS
      # fingerprint differs between Python builds, and Cloudflare blocks
      # some of them — use the same toolchain the local builds are
      # verified with (see RELEASING.md).
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.14"

      - name: Install project and PyInstaller
        run: uv sync --frozen --group build

      - name: Build binary
        run: uv run --no-sync pyinstaller uukanshu.spec --noconfirm

      - name: Rename binary
        shell: bash
        run: mv dist/uukanshu* "dist/${{ matrix.asset }}"

      - name: Smoke test binary
        shell: bash
        run: |
          dist/${{ matrix.asset }} --version
          dist/${{ matrix.asset }} --book 18957 --list > /dev/null
          echo 'smoke test OK'

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Attach binaries to GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create release and upload binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" --generate-notes
