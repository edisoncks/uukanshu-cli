[project]
name = "uukanshu"
description = "Read novels from uukanshu.cc in your terminal"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = [
    "OpenCC",
    "certifi",
    "textual >=8.2,<9",
]

[project.scripts]
uukanshu = "uukanshu:main"

[dependency-groups]
build = ["pyinstaller>=6"]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/uukanshu/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/uukanshu"]
